[project]
name = "finanzmaschine-staking"
version = "0.1.0"
description = "Finanzmaschine Staking"
authors = [
    { name = "ax-va"}
]
license = { file = "../../LICENSE.md" }
readme = "../../README.md"
requires-python = ">=3.12,<4.0"
keywords = ["finance", "crypto", "staking", "staking-rewards"]

dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "polars>=1.38.1,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "sqlmodel>=0.0.39,<0.1.0",
    "finanzmaschine-keying>=0.1.0,<1.0.0",
    "finanzmaschine-crypto>=0.1.0,<1.0.0",
]

[poetry.urls]
Homepage = "https://github.com/ax-va/Finanzmaschine"
Repository = "https://github.com/ax-va/Finanzmaschine/tree/main/py/finanzmaschine-staking"

[project.entry-points."fzm_alembic.models"]
near_staking_snapshots = "fzm_staking.orm.near.snapshot"
near_staking_snapshot_searches = "fzm_staking.orm.near.snapshot_search"
near_staking_actions = "fzm_staking.orm.near.action"

[project.entry-points."fzm_alembic.migrations"]
staking = "fzm_staking.migrations"

[dependenncy-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12.0,<0.13.0",
    "alembic>=1.20.0,<2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "fzm_staking", from = "src" },
]

[tool.poetry.dependencies]
finanzmaschine-keying = { path = "../finanzmaschine-keying", develop = true }
finanzmaschine-crypto = { path = "../finanzmaschine-crypto", develop = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"  # Show extra summary info for all except passed tests (e.g., reasons for skipped tests, XFAIL, etc.)
markers = [
    "unit: unit tests",
    "integration: integration tests"
]

[tool.ruff]
# Apply formatting + linting to these paths
src = ["src", "tests"]

# Formatting options
line-length = 88  # black-compatible
indent-width = 4
target-version = "py312"  # Python version

[tool.ruff.format]
quote-style = "double"  # Enforce double quotes
indent-style = "space"  # Use spaces over tabs
skip-magic-trailing-comma = false  # Enable the Black-style magic trailing comma behavior (each arg on its own line when a trailing comma exists)
line-ending = "lf"  # line feed `\n` - the standard on Linux/macOS and most modern tooling

[tool.ruff.lint]
# Enable common linting rule sets
select = [
  "E",  # pycodestyle errors like whitespace, indentation, spacing around operators.
  "F",  # pyflakes catches things like unused imports, undefined variables.
  "I",  # isort (import sorting) enforces consistent import sorting.
  "B",  # bugbear warns about common pitfalls and bad practices (e.g. mutable defaults).
  "UP", # pyupgrade suggests modern Python syntax (e.g. using `|` for union types instead of `Union[]`, f-strings instead of `.format`).
]
ignore = [
  "E501",  # Ingnore "line too long" (handled by formatter) to avoid double-reporting the same thing
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore F401 "imported but unused" (from Pyflakes) only in `__init__.py` files
