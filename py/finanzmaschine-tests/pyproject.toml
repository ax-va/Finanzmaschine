[project]
name = "finanzmaschine-tests"
version = "0.1.0"
description = "Finanzmaschine Tests"
authors = [
    { name = "ax-va"}
]
license = { file = "../../LICENSE.md" }
readme = "../../README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "finanzmaschine-keying @ file:///home/delorian/PycharmProjects/Finanzmaschine/py/finanzmaschine-keying",
    "finanzmaschine-near @ file:///home/delorian/PycharmProjects/Finanzmaschine/py/finanzmaschine-near",
    "finanzmaschine-migrations @ file:///home/delorian/PycharmProjects/Finanzmaschine/py/finanzmaschine-alembic"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
finanzmaschine-keying = {develop = true}
finanzmaschine-near = {develop = true}
finanzmaschine-migrations = {develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
testpaths = ["integration"]
python_files = ["test_*.py"]
addopts = "-ra"
